[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendscope"
version = "0.1.0"
description = "Sales forecasting (Prophet/ARIMA) and per-segment opportunity sizing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "seaborn>=0.13",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1.5"]
databricks = ["databricks-sql-connector>=3.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
trendscope = "trendscope.cli:main"

[tool.setuptools.packages.find]
include = ["trendscope*"]

[tool.setuptools.package-data]
trendscope = ["../sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
